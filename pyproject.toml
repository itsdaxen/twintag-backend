[project]
name = "twintag-backend"
version = "0.1.0"
description = "API and processing pipeline for TwinTag digital-twin asset recognition"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "laspy[lazrs]>=2.6.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pye57>=0.4.19",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
twintag = "twintag_backend.cli:run"
twintag-backend = "twintag_backend.main:run"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
